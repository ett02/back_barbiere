<div class="min-h-screen flex items-center justify-center p-4">
  <div
    class="w-full max-w-md bg-surface backdrop-blur-md border border-surface-border shadow-glass rounded-2xl p-8 animate-[fadeInUp_0.6s_ease-out]">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-primary mb-2 tracking-tight font-heading">Registrazione</h1>
      <p class="text-text-secondary text-base font-medium">Crea il tuo account</p>
    </div>

    <form class="flex flex-col gap-5" (ngSubmit)="register()">
      <div class="space-y-2">
        <label class="block font-semibold text-sm text-text-secondary" for="nome">Nome</label>
        <input type="text" id="nome"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white/90 focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary-light transition-all"
          [(ngModel)]="user.nome" name="nome" required placeholder="Mario" />
      </div>

      <div class="space-y-2">
        <label class="block font-semibold text-sm text-text-secondary" for="cognome">Cognome</label>
        <input type="text" id="cognome"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white/90 focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary-light transition-all"
          [(ngModel)]="user.cognome" name="cognome" required placeholder="Rossi" />
      </div>

      <div class="space-y-2">
        <label class="block font-semibold text-sm text-text-secondary" for="email">Email</label>
        <input type="email" id="email"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white/90 focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary-light transition-all"
          [(ngModel)]="user.email" name="email" required placeholder="mario.rossi@email.com" />
      </div>

      <div class="space-y-2">
        <label class="block font-semibold text-sm text-text-secondary" for="password">Password</label>
        <input type="password" id="password"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white/90 focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary-light transition-all"
          [(ngModel)]="user.password" name="password" required placeholder="••••••••" />
      </div>

      <button type="submit"
        class="w-full py-3.5 px-6 bg-primary text-white font-heading font-semibold rounded-full shadow-primary hover:bg-primary-hover active:scale-95 transition-all mt-4 flex items-center justify-center gap-2">
        Registrati
      </button>

      <div class="text-center text-sm text-text-secondary mt-4">
        <a routerLink="/login" class="text-primary font-semibold hover:underline">Hai già un account? Accedi</a>
      </div>
    </form>
  </div>
</div>
