<div class="min-h-screen flex items-center justify-center p-4">
  <div
    class="w-full max-w-md bg-surface backdrop-blur-md border border-surface-border shadow-glass rounded-2xl p-8 animate-[fadeInUp_0.6s_ease-out]">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-primary mb-2 tracking-tight font-heading">💈 Barbershop</h1>
      <p class="text-text-secondary text-base font-medium">Accedi al tuo account</p>
    </div>

    <div
      class="bg-red-50 text-error p-3 rounded-lg text-center text-sm font-medium border border-red-100 mb-6 animate-pulse"
      *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form class="flex flex-col gap-6" (ngSubmit)="login()">
      <div class="space-y-2">
        <label class="block font-semibold text-sm text-text-secondary" for="email">Email</label>
        <input type="email" id="email"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white/90 focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary-light transition-all"
          [(ngModel)]="credentials.email" name="email" placeholder="esempio@email.com" required />
      </div>

      <div class="space-y-2">
        <label class="block font-semibold text-sm text-text-secondary" for="password">Password</label>
        <input type="password" id="password"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white/90 focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary-light transition-all"
          [(ngModel)]="credentials.password" name="password" placeholder="password" required />
      </div>

      <div class="mt-2">
        <button type="submit"
          class="w-full py-3.5 px-6 bg-primary text-white font-heading font-semibold rounded-full shadow-primary hover:bg-primary-hover active:scale-95 transition-all flex items-center justify-center gap-2">
          Accedi
        </button>
      </div>
    </form>

    <div
      class="flex items-center text-text-secondary text-sm my-6 before:flex-1 before:border-b before:border-gray-200 after:flex-1 after:border-b after:border-gray-200">
      <span class="px-4">oppure</span>
    </div>

    <div class="text-center text-sm text-text-secondary">
      <p>Non hai un account? <a routerLink="/register" class="text-primary font-semibold hover:underline">Registrati</a>
      </p>
    </div>
  </div>
</div>
